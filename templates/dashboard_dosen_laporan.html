<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Tugas - Dosen</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dist/output.css') }}"
    />
  </head>
  <body class="bg-gray-50 text-gray-800 min-h-screen font-sans">
    <div class="flex">
      <!-- Sidebar -->
      <aside class="w-64 bg-white shadow-md h-screen fixed">
        <div class="p-6 border-b">
          <h2 class="text-2xl font-bold text-purple-700"> Asisten Dosen</h2>
           <p class="mt-1 text-sm text-gray-500">Panel Praktikum</p>
        </div>
        <nav class="px-4 py-4 space-y-2">
          <a
            href="{{ url_for('dosen_dashboard') }}"
            class="block py-2 px-4 rounded transition duration-200 hover:bg-purple-100 hover:text-purple-700"
            >Jadwal Mengajar</a
          >
          <a
            href="{{ url_for('list_kehadiran') }}"
            class="block py-2 px-4 rounded transition duration-200 hover:bg-purple-100 hover:text-purple-700"
            >Validasi Kehadiran</a
          >
          <a
            href="{{ url_for('upload_tugas') }}"
            class="block py-2 px-4 rounded bg-purple-100 text-purple-700 font-semibold"
            >Laporan/Tugas</a
          >
          <a
            href="{{ url_for('daftar_tugas') }}"
            class="block py-2 px-4 rounded hover:bg-purple-100 hover:text-purple-700"
            >Daftar Kumpul</a
          >
          <a
            href="{{ url_for('logout') }}"
            class="block py-2 px-4 text-red-500 hover:bg-red-100 transition duration-200"
            >Logout</a
          >
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="ml-64 w-full p-10">
        <h1 class="text-3xl font-bold text-purple-700 mb-6">
          Upload Tugas Praktikum
        </h1>

        <!-- Form Upload Tugas -->
        <div class="bg-white p-8 rounded-xl shadow mb-10">
          <form method="POST" enctype="multipart/form-data" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                  >Judul Tugas</label
                >
                <input
                  type="text"
                  name="judul"
                  required
                  class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
                />
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                  >Deadline</label
                >
                <input
                  type="date"
                  name="deadline"
                  required
                  class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
                />
              </div>
            </div>

            <!-- Dropdown Mata Kuliah -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Mata Kuliah</label
              >
              <select
                name="mata_kuliah_id"
                required
                class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
              >
                <option value="">-- Pilih Mata Kuliah --</option>
                {% for mk in mata_kuliah_list %}
                <option value="{{ mk._id }}">{{ mk.nama }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Dropdown Pertemuan -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Pertemuan</label
              >
              <select
                name="pertemuan"
                required
                class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
              >
                <option value="">-- Pilih Pertemuan --</option>
                {% for i in range(1, 17) %}
                <option value="Pertemuan {{ i }}">Pertemuan {{ i }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Catatan -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Catatan</label
              >
              <textarea
                name="catatan"
                rows="3"
                class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
                placeholder="Contoh: Sertakan referensi atau panduan praktikum..."
              ></textarea>
            </div>

            <!-- Upload File -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Unggah File (PDF, Gambar, PPT)</label
              >
              <input
                type="file"
                name="file"
                accept=".pdf,.jpg,.jpeg,.png,.ppt,.pptx"
                required
                class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
              />
            </div>

            <div class="text-right">
              <button
                type="submit"
                class="inline-block bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700 transition duration-200"
              >
                Upload Tugas
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
