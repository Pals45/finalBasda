<!-- templates/upload_tugas_mahasiswa.html -->
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Upload Tugas</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dist/output.css') }}"
    />
  </head>
  <body class="bg-gray-100 text-gray-800 min-h-screen">
    <div class="max-w-xl mx-auto mt-12 bg-white p-6 rounded shadow">
      <h1 class="text-2xl font-bold mb-4 text-purple-700">Upload Tugas</h1>
      <form
        action="{{ url_for('upload_tugas_mahasiswa') }}"
        method="POST"
        enctype="multipart/form-data"
        class="space-y-4"
      >
        <div>
          <label for="nama" class="block text-sm font-medium text-gray-700"
            >Nama</label
          >
          <input
            type="text"
            name="nama"
            id="nama"
            required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-purple-500 focus:border-purple-500"
          />
        </div>
        <div>
          <label for="Laporan" class="block text-sm font-medium text-gray-700"
            >Laporan</label
          >
          <select
            name="laporan"
            id="Laporan"
            required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-purple-500 focus:border-purple-500"
          >
            <option value="">-- Pilih Pertemuan --</option>
            <option value="Pertemuan 1">Pertemuan 1</option>
            <option value="Pertemuan 2">Pertemuan 2</option>
            <option value="Pertemuan 3">Pertemuan 3</option>
            <!-- Tambah pertemuan sesuai kebutuhan -->
          </select>
        </div>
        <div>
          <label for="file" class="block text-sm font-medium text-gray-700"
            >File Laporan (PDF/Word)</label
          >
          <input
            type="file"
            name="file"
            id="file"
            accept=".pdf,.doc,.docx"
            required
            class="mt-1 block w-full"
          />
        </div>
        <button
          type="submit"
          class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700"
        >
          Upload
        </button>
      </form>
    </div>
  </body>
</html>
