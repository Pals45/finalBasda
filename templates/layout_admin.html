<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Admin Panel{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dist/output.css') }}">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

<div class="flex">
  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow-md h-screen fixed">
    <div class="p-6">
      <h2 class="text-2xl font-bold text-purple-700">Admin</h2>
      <p class="text-sm text-gray-500">Panel Pengelolaan</p>
    </div>
    <nav class="px-4">
      <ul class="space-y-2">
        <li>
          <a href="{{ url_for('admin_dashboard') }}"
             class="block py-2 px-4 rounded hover:bg-purple-100 {% if request.path == '/admin' %}bg-purple-100 text-purple-700 font-semibold{% endif %}">
             Dashboard
          </a>
        </li>
        <li>
          <a href="{{ url_for('data_mahasiswa') }}"
             class="block py-2 px-4 rounded hover:bg-purple-100 {% if '/admin/data-mahasiswa' in request.path %}bg-purple-100 text-purple-700 font-semibold{% endif %}">
             Data Mahasiswa
          </a>
        </li>
        <li>
          <a href="{{ url_for('logout') }}"
             class="block py-2 px-4 text-red-500 hover:bg-red-100">Logout</a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="ml-64 flex-1 p-8">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
