<!-- templates/dashboard_dosen.html -->
{% extends 'dashboard_base.html' %}
{% block title %}Dashboard Dosen{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-4">Dashboard Dosen Pembimbing</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <div class="p-4 bg-white shadow rounded-xl">
    <h3 class="text-lg font-bold mb-2">Daftar Mahasiswa</h3>
    <p>Lihat daftar dan progress mahasiswa bimbingan.</p>
    <button class="mt-2 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Lihat Mahasiswa</button>
  </div>
  <div class="p-4 bg-white shadow rounded-xl">
    <h3 class="text-lg font-bold mb-2">Validasi Kehadiran</h3>
    <p>Validasi laporan dan kehadiran mahasiswa.</p>
    <button class="mt-2 px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600">Validasi</button>
  </div>
</div>
{% endblock %}
