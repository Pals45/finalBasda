<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Data Dosen - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dist/output.css') }}"
    />
  </head>
  <body class="bg-gray-100 text-gray-800 min-h-screen">
    <div class="flex">
      <!-- Sidebar -->
      <aside class="w-64 bg-white shadow-md h-screen fixed">
        <div class="p-6">
          <h2 class="text-2xl font-bold text-purple-700">Admin</h2>
          <p class="text-sm text-gray-500">Panel Pengelolaan</p>
        </div>
        <nav class="px-4">
          <ul class="space-y-2">
            <li>
              <a
                href="{{ url_for('admin_dashboard') }}"
                class="block py-2 px-4 rounded hover:bg-purple-100"
                >Jadwal Praktikum</a
              >
            </li>
            <li>
              <a
                href="{{ url_for('data_mahasiswa') }}"
                class="block py-2 px-4 rounded hover:bg-purple-100"
                >Data Mahasiswa</a
              >
            </li>
            <li>
              <a
                href="{{ url_for('data_mata_kuliah') }}"
                class="block py-2 px-4 rounded hover:bg-purple-100"
                >Data Mata Kuliah</a
              >
            </li>
            <li>
              <a
                href="{{ url_for('data_dosen') }}"
                class="block py-2 px-4 rounded bg-purple-100 text-purple-700 font-semibold"
                >Data Dosen</a
              >
            </li>
            <li>
              <a
                href="{{ url_for('logout') }}"
                class="block py-2 px-4 text-red-500 hover:bg-red-100"
                >Logout</a
              >
            </li>
          </ul>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="ml-64 flex-1 p-8">
        <h1 class="text-3xl font-bold text-purple-700 mb-6">Data Dosen</h1>

        <div class="bg-white rounded-lg shadow p-6 overflow-x-auto">
          
          <!-- Form Tambah Dosen -->
          <form
            action="{{ url_for('add_user_dosen') }}"
            method="POST"
            class="bg-white p-4 rounded-lg shadow mt-6"
          >
            <h2 class="text-lg font-semibold mb-2">Tambah Dosen</h2>
            <div class="grid grid-cols-2 gap-4">
              <input
                type="text"
                name="nipn"
                placeholder="NIP"
                required
                class="p-2 border rounded w-full"
              />
              <input
                type="text"
                name="name"
                placeholder="Nama"
                required
                class="p-2 border rounded w-full"
              />
              <input
                type="email"
                name="email"
                placeholder="Email"
                required
                class="p-2 border rounded w-full"
              />
              <input
                type="text"
                name="jurusan"
                placeholder="Jurusan"
                required
                class="p-2 border rounded w-full"
              />
            </div>
            <button
              type="submit"
              class="mt-4 px-4 py-2 bg-purple-600 text-white rounded"
            >
              Tambah
            </button>
          </form>
          <br><br>
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-100">
              <tr>
                <th
                  class="px-4 py-2 text-left text-sm font-medium text-gray-600"
                >
                  NIP
                </th>
                <th
                  class="px-4 py-2 text-left text-sm font-medium text-gray-600"
                >
                  Nama
                </th>
                <th
                  class="px-4 py-2 text-left text-sm font-medium text-gray-600"
                >
                  Email
                </th>
                <th
                  class="px-4 py-2 text-left text-sm font-medium text-gray-600"
                >
                  Jurusan
                </th>
              </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-100">
              {% for dsn in dosen %}
              <tr class="hover:bg-gray-50">
                <td class="px-4 py-2 text-sm">{{ dsn.nidn }}</td>
                <td class="px-4 py-2 text-sm">{{ dsn.name }}</td>
                <td class="px-4 py-2 text-sm">{{ dsn.email }}</td>
                <td class="px-4 py-2 text-sm">{{ dsn.jurusan }}</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
